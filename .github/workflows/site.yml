name: Robots diagnostic

on:
  push:
    branches:
      - verify/site-production

permissions:
  contents: read

jobs:
  robots:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect robots
        shell: bash
        run: |
          set -euo pipefail
          echo "HTTPS robots"
          curl --silent --show-error --max-time 20 --dump-header - https://johndgomez.com/robots.txt
          echo
          echo "HTTP robots"
          curl --silent --show-error --max-time 20 --dump-header - http://johndgomez.com/robots.txt
          echo
          echo "Googlebot robots"
          curl --silent --show-error --max-time 20 --user-agent "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" --dump-header - https://johndgomez.com/robots.txt
