name: Lighthouse audit details

on:
  push:
    branches:
      - verify/site-production

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Lighthouse
        run: npm install --global lighthouse@13.0.1
      - name: Audit production
        shell: bash
        run: |
          set -euo pipefail
          lighthouse "https://johndgomez.com/" --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path=/tmp/lhr.json
          node -e "const r=require('/tmp/lhr.json'); for(const id of ['errors-in-console','inspector-issues','robots-txt','render-blocking-insight','network-dependency-tree-insight','first-contentful-paint','largest-contentful-paint']){const a=r.audits[id]; console.log('BEGIN',id); console.log(JSON.stringify(a,null,2)); console.log('END',id)}"
